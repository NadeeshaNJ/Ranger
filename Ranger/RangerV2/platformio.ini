; Ranger Phase 2
; Pick an environment in the VS Code status bar: "ranger" = final firmware,
; "test_xxx" = the small test for one module (src/tests/test_xxx.cpp).

[env]
platform      = espressif32@^6.9.0      ; Arduino-ESP32 2.0.x
board         = esp32dev
framework     = arduino
monitor_speed = 115200
lib_deps      =
    olikraus/U8g2@^2.35                 ; OLED
    jgromes/RadioLib@^7.7.1             ; LoRa radio
    sh123/esp32_codec2@1.0.7            ; Codec2 voice
    mikalhart/TinyGPSPlus@^1.1.0        ; GPS sentences

[env:ranger]
build_src_filter = +<*> -<tests/>

[env:test_mic]
build_src_filter = -<*> +<tests/test_mic.cpp>

[env:test_speaker]
build_src_filter = -<*> +<tests/test_speaker.cpp>

[env:test_controls]
build_src_filter = -<*> +<tests/test_controls.cpp>

[env:test_display]
build_src_filter = -<*> +<tests/test_display.cpp>

[env:test_ui]
build_src_filter = -<*> +<tests/test_ui.cpp>

[env:test_radio]
build_src_filter = -<*> +<tests/test_radio.cpp>

[env:test_net]
build_src_filter = -<*> +<tests/test_net.cpp>

[env:test_crypto]
build_src_filter = -<*> +<tests/test_crypto.cpp>

[env:test_codec]
build_src_filter = -<*> +<tests/test_codec.cpp>

[env:test_voice]
build_src_filter = -<*> +<tests/test_voice.cpp>

[env:test_gps]
build_src_filter = -<*> +<tests/test_gps.cpp>

[env:test_battery]
build_src_filter = -<*> +<tests/test_battery.cpp>
