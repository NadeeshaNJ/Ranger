; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Two ESP32 modules are built from two separate source folders:
;   src_node_a/ -> [env:node_a]   (Silicon Labs CP2102 bridge)
;   src_node_b/ -> [env:node_b]   (WCH CH343 bridge)
;
; src_dir is a global option, so the per-env folder is selected by the
; custom_src_dir option below, applied by scripts/set_src_dir.py.
;
; Ports use /dev/serial/by-id/ rather than /dev/ttyUSB0 or /dev/ttyACM0.
; The kernel hands out those numbers in plug order, so they flip between
; runs; the by-id paths are derived from each USB bridge's serial number
; and stay pinned to the same physical board no matter the plug order.

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/set_src_dir.py
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit SSD1306@^2.5.17
	esphome/ESP32-audioI2S@^2.3.0
	sandeepmistry/LoRa@^0.8.0
	adafruit/Adafruit BusIO@^1.17.4
	olikraus/U8g2@^2.36.18
	caveman99/ESP32 Codec2@^1.0.1
	xreef/PCF8575 library@^2.0.1

[env:node_a]
extends = common
custom_src_dir = src_node_a
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = ${this.upload_port}

[env:node_b]
extends = common
custom_src_dir = src_node_b
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_588F056876-if00
monitor_port = ${this.upload_port}
